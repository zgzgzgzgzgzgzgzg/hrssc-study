报指导","D":"组织专家审核"},"context":[],"answer":"D","explanation":"组织专家审核属于政府主管部门或第三方评审机构的职责，HRSSC 负责咨询、指导与结果反馈等事务性服务。","scoring":""},{"id":"P5-single-8","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":8,"stem":"8．人力资源共享服务中心建设七步法中，位于“服务目录设计”之后、“组织设计”之前的环节是（  ）。","options":{"A":"业务流程梳理","B":"可行性分析","C":"系统选型","D":"试点运行"},"context":[],"answer":"C","explanation":"七步法顺序：可行性分析→业务流程梳理→服务目录设计→系统选型→组织设计→试点运行→全面推广。","scoring":""},{"id":"P5-single-9","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":9,"stem":"9．HRSSC 的服务目录主要作用是（  ）。","options":{"A":"明确可提供的服务事项、标准与时效承诺（SLA）","B":"记录员工的家庭情况","C":"替代劳动合同","D":"用于对外宣传招聘"},"context":[],"answer":"A","explanation":"服务目录是 HRSSC 与员工/业务部门的“服务契约”，明确服务事项、办理标准、时效承诺与责任边界。","scoring":""},{"id":"P5-single-10","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":10,"stem":"10．下列职业守则表述中，正确的是（  ）。","options":{"A":"诚实公正、严谨求是","B":"人尽其才、能置其位","C":"勤勉好学、追求卓越","D":"以上都正确"},"context":[],"answer":"D","explanation":"人力资源从业人员的职业守则包括诚实公正严谨求是、人尽其才能置其位、有效激励促进和谐、勤勉好学追求卓越、科学管理合理配置等。","scoring":""},{"id":"P5-single-11","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":11,"stem":"11．HRSSC 在处理员工个人信息时，应遵循的核心原则不包括（  ）。","options":{"A":"合法、正当、必要与诚信原则","B":"最小必要原则","C":"公开透明与知情同意","D":"尽可能多地采集与长期留存"},"context":[],"answer":"D","explanation":"《个人信息保护法》强调最小必要、目的限定与限期存储，超范围采集与无限期留存均属违规。","scoring":""},{"id":"P5-single-12","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":12,"stem":"12．员工在试用期解除劳动合同，应提前（  ）通知用人单位。","options":{"A":"3 日","B":"7 日","C":"15 日","D":"30 日"},"context":[],"answer":"A","explanation":"《劳动合同法》第三十七条：劳动者在试用期内提前 3 日通知用人单位，可以解除劳动合同；转正后需提前 30 日书面通知。","scoring":""},{"id":"P5-single-13","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":13,"stem":"13．用人单位自用工之日起超过 1 个月不满 1 年未与劳动者订立书面劳动合同的，应当（  ）。","options":{"A":"向劳动者每月支付二倍的工资","B":"向劳动者支付一个月工资作为补偿后即可免责","C":"无需承担任何责任","D":"视为已订立无固定期限劳动合同"},"context":[],"answer":"A","explanation":"《劳动合同法》第八十二条：超过 1 个月不满 1 年未订立书面劳动合同的，应当向劳动者每月支付二倍的工资；满 1 年未订立的，视为已订立无固定期限劳动合同。","scoring":""},{"id":"P5-single-14","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":14,"stem":"14．下列关于劳务派遣的表述，正确的是（  ）。","options":{"A":"劳务派遣单位应向被派遣劳动者按月支付劳动报酬","B":"用工单位可以将被派遣劳动者再派遣到其他用人单位","C":"劳务派遣单位可以向被派遣劳动者收取费用","D":"用工单位与被派遣劳动者之间存在劳动合同关系"},"context":[],"answer":"A","explanation":"劳务派遣单位是用人单位，应履行按月支付报酬等义务；不得再派遣、不得收费；劳动合同关系存在于派遣单位与被派遣劳动者之间。","scoring":""},{"id":"P5-single-15","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":15,"stem":"15．下列情形中，用人单位可以单方解除劳动合同且无需支付经济补偿的是（  ）。","options":{"A":"劳动者严重违反用人单位的规章制度的","B":"劳动者患病在规定的医疗期满后不能从事原工作的","C":"劳动者不能胜任工作，经过培训仍不能胜任的","D":"劳动合同订立时所依据的客观情况发生重大变化的"},"context":[],"answer":"A","explanation":"因劳动者过错（严重违纪等）解除的，用人单位无需支付经济补偿；B、C、D 属非过错性解除或情势变更，需依法支付经济补偿或提前通知。","scoring":""},{"id":"P5-single-16","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":16,"stem":"16．在 HRSSC 运营管理中，“一次解决率（FCR）”指的是（  ）。","options":{"A":"工单在首次响应时即被解决、无需二次流转的比例","B":"工单在 24 小时内响应的比例","C":"员工投诉被撤回的比例","D":"系统故障一次修复成功的比例"},"context":[],"answer":"A","explanation":"一次解决率衡量的是“首次接触即解决”的能力，是 HRSSC 服务质量与知识库成熟度的核心指标。","scoring":""},{"id":"P5-single-17","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":17,"stem":"17．本课程教学内容对接的教育部 1+X 证书是（  ）。","options":{"A":"人力资源共享服务职业技能等级证书","B":"企业人力资源管理师职业资格证书","C":"劳动关系协调员职业资格证书","D":"薪税师职业技能等级证书"},"context":[],"answer":"A","explanation":"本课程对接教育部 1+X 人力资源共享服务职业技能等级证书（初级）标准，实现“课证融通”。","scoring":""},{"id":"P5-single-18","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":18,"stem":"18．在 HRSSC 建设初期，最适合采用的共享服务模式通常是（  ）。","options":{"A":"市场模式","B":"强制模式","C":"推荐模式","D":"完全外包模式"},"context":[],"answer":"C","explanation":"建设初期 SSC 能力与口碑尚在培育，采用推荐模式（鼓励但不强制）阻力较小，待服务成熟后再逐步过渡到强制模式或市场模式。","scoring":""},{"id":"P5-single-19","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":19,"stem":"19．下列指标中，最适合用于衡量 HRSSC 数字化运营效率的是（  ）。","options":{"A":"人均服务员工数与服务自动化率","B":"员工平均通勤距离","C":"办公场地面积","D":"员工平均年龄"},"context":[],"answer":"A","explanation":"人均服务比与服务自动化率直接反映共享中心的规模化与数字化水平，是运营效率的核心衡量指标。","scoring":""},{"id":"P5-single-20","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"single","num":20,"stem":"20．在跨部门协同中，HRSSC 与财务部门最常见的协同场景是（  ）。","options":{"A":"薪酬核算数据与成本科目核对、付款流程对接","B":"产品研发评审","C":"市场营销方案制定","D":"生产设备检修"},"context":[],"answer":"A","explanation":"薪酬发放涉及工资数据、成本归集与付款审批，是 HRSSC 与财务协同最频繁的场景，需确保 eHR 与财务系统数据一致。","scoring":""},{"id":"P5-multi-1","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":1,"stem":"1．下列职业守则表述中，正确的有（  ）。","options":{"A":"诚实公正、严谨求是","B":"人尽其才、能置其位","C":"有效激励、促进和谐","D":"勤勉好学、追求卓越"},"context":[],"answer":"ABCD","explanation":"四项均为人力资源从业人员职业守则的规范表述，另含“科学管理、合理配置”。","scoring":""},{"id":"P5-multi-2","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":2,"stem":"2．HRSSC 建设七步法包括（  ）。","options":{"A":"可行性分析与业务流程梳理","B":"服务目录设计","C":"系统选型与组织设计","D":"试点运行与全面推广"},"context":[],"answer":"ABCD","explanation":"七步法完整流程：可行性分析→业务流程梳理→服务目录设计→系统选型→组织设计→试点运行→全面推广。","scoring":""},{"id":"P5-multi-3","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":3,"stem":"3．HRSSC 员工咨询应答应遵循的原则有（  ）。","options":{"A":"及时响应、态度亲和","B":"口径统一、依据制度","C":"保守秘密、保护隐私","D":"闭环记录、知识沉淀"},"context":[],"answer":"ABCD","explanation":"四项共同构成 HRSSC 咨询应答的服务标准，体现专业性与服务意识。","scoring":""},{"id":"P5-multi-4","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":4,"stem":"4．员工投诉按类型通常可分为（  ）。","options":{"A":"政策类投诉","B":"流程类投诉","C":"系统使用类投诉","D":"服务态度类投诉"},"context":[],"answer":"ABCD","explanation":"按性质划分便于分类流转与责任归属：政策类→COE，业务类→HRBP，系统类→系统支持，服务类→SSC 自查整改。","scoring":""},{"id":"P5-multi-5","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":5,"stem":"5．下列做法中，符合人力资源数据安全管理要求的有（  ）。","options":{"A":"按岗位职责实行系统权限分级授权","B":"敏感数据导出需审批并加密传输","C":"定期开展权限复核与账号清理","D":"将员工花名册共享至公开网盘方便查阅"},"context":[],"answer":"ABC","explanation":"权限分级、审批加密、定期复核均为合规做法；将花名册置于公开网盘属严重违规，可能导致个人信息泄露。","scoring":""},{"id":"P5-multi-6","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":6,"stem":"6．HRSSC 与 HRBP、COE 实现高效协同的支撑机制包括（  ）。","options":{"A":"统一的服务目录与 SLA 标准","B":"工单系统与知识库","C":"定期的三方沟通例会","D":"共享的数据报表与看板"},"context":[],"answer":"ABCD","explanation":"制度（服务目录/SLA）、系统（工单/知识库）、机制（例会）与数据（共享看板）共同支撑三支柱高效协同。","scoring":""},{"id":"P5-multi-7","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":7,"stem":"7．下列情形中，用人单位应当向劳动者支付经济补偿的有（  ）。","options":{"A":"用人单位提出并与劳动者协商一致解除劳动合同的","B":"劳动者患病医疗期满后不能从事原工作，也不能从事另行安排的工作，用人单位解除的","C":"劳动者严重违反用人单位规章制度被解除的","D":"劳动合同期满，用人单位降低原合同约定条件续订而劳动者不同意续订的"},"context":[],"answer":"ABD","explanation":"《劳动合同法》第四十六条规定了支付经济补偿的情形；C 属劳动者过错解除，无需支付经济补偿。","scoring":""},{"id":"P5-multi-8","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":8,"stem":"8．HRSSC 运营管理中可用于持续改进的工具与方法有（  ）。","options":{"A":"PDCA 循环","B":"鱼骨图与 5 Why 根因分析","C":"ESIA 流程优化","D":"服务质效指标监控与复盘"},"context":[],"answer":"ABCD","explanation":"PDCA 提供改进闭环，鱼骨图与 5 Why 用于归因，ESIA 用于流程再设计，指标监控与复盘用于效果验证。","scoring":""},{"id":"P5-multi-9","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":9,"stem":"9．本课程强调的“课证融通”具体体现在（  ）。","options":{"A":"教学内容对接 1+X 人力资源共享服务职业技能等级证书（初级）标准","B":"采用该证书配套指定教材","C":"综合实践项目对标证书实操技能考核要求","D":"取得证书可按学校规定申请相应成绩认定"},"context":[],"answer":"ABCD","explanation":"课证融通体现在标准对接、教材选用、实践对标与成绩认定四个层面。","scoring":""},{"id":"P5-multi-10","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"multi","num":10,"stem":"10．在跨部门协同场景中，HRSSC 需要与哪些部门高频协作？（  ）","options":{"A":"财务部门（薪酬发放与成本核对）","B":"用人部门（考勤与绩效确认）","C":"IT 部门（系统运维与权限管理）","D":"行政与法务（合规与制度支持）"},"context":[],"answer":"ABCD","explanation":"HRSSC 处于流程中枢，需与财务、业务、IT、行政法务等多方高频协作，跨部门沟通能力是核心职业素养。","scoring":""},{"id":"P5-judge-1","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":1,"stem":"1．HRSSC 的核心价值在于把事务性、标准化的工作集中处理，从而释放 HRBP 与 COE 精力投入高价值工作。（  ）","options":{},"context":[],"answer":"正确","explanation":"这正是共享服务模式的初衷：规模化、标准化处理事务性工作，让 HR 从“事务型”转向“战略型”。","scoring":""},{"id":"P5-judge-2","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":2,"stem":"2．HRSSC 的服务目录一经制定即永久有效，无需根据业务变化更新。（  ）","options":{},"context":[],"answer":"错误","explanation":"服务目录应随业务变化、系统能力与员工需求定期评审更新，否则会与实际服务脱节。","scoring":""},{"id":"P5-judge-3","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":3,"stem":"3．员工投诉涉及政策解释的，HRSSC 应自行解释并答复，无需移交 COE。（  ）","options":{},"context":[],"answer":"错误","explanation":"政策类投诉应由 COE 统一解释与裁定，避免口径不一导致新的争议。","scoring":""},{"id":"P5-judge-4","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":4,"stem":"4．处理员工个人信息时，只要员工入职时签署过一次同意书，后续所有处理行为都无需再次取得同意。（  ）","options":{},"context":[],"answer":"错误","explanation":"处理目的、方式、种类发生变更，或处理敏感个人信息、对外提供、公开等情形，应重新取得同意（单独同意）。","scoring":""},{"id":"P5-judge-5","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":5,"stem":"5．用人单位以劳动者严重违反规章制度为由解除劳动合同，无需支付经济补偿。（  ）","options":{},"context":[],"answer":"正确","explanation":"《劳动合同法》第三十九条规定的过错性解除，用人单位无需支付经济补偿，但须保证规章制度合法有效且举证充分。","scoring":""},{"id":"P5-judge-6","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":6,"stem":"6．HRSSC 的数字化转型就是简单地把线下流程搬到线上，无需重新设计流程。（  ）","options":{},"context":[],"answer":"错误","explanation":"数字化应是“流程再造＋系统固化”，若先不优化流程就上系统，只会把低效流程固化得更快。","scoring":""},{"id":"P5-judge-7","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":7,"stem":"7．跨部门协同中，HRSSC 只需按流程执行，无需主动沟通与反馈。（  ）","options":{},"context":[],"answer":"错误","explanation":"HRSSC 处于流程中枢，需主动沟通、及时反馈并推动问题解决，这是服务意识与责任担当的体现。","scoring":""},{"id":"P5-judge-8","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":8,"stem":"8．员工满意度调查完成后，若不跟踪改进措施的落地效果，调查本身难以产生实际价值。（  ）","options":{},"context":[],"answer":"正确","explanation":"满意度调查的价值在于闭环改进，跟踪反馈是最后也是关键的一步。","scoring":""},{"id":"P5-judge-9","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":9,"stem":"9．取得 1+X 人力资源共享服务职业技能等级证书（初级）的学生，可凭证书按学校相关规定申请课程实践考核成绩的相应认定。（  ）","options":{},"context":[],"answer":"正确","explanation":"这是本课程“课证融通”设计的制度安排，鼓励学生以证促学、以学备考。","scoring":""},{"id":"P5-judge-10","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"judge","num":10,"stem":"10．HRSSC 员工可以将工作中接触到的薪酬数据用于个人研究或分享给同学参考，只要不对外公开即可。（  ）","options":{},"context":[],"answer":"错误","explanation":"薪酬数据属核心涉密信息，任何超范围使用与对外提供均违反数据保密义务与《个人信息保护法》。","scoring":""},{"id":"P5-short-1","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"short","num":1,"stem":"1．简述人力资源共享服务中心（HRSSC）的建设流程（七步法）。（5 分）","options":{},"context":[],"answer":"（1）可行性分析：评估企业规模、业务集中度、现有 HR 运营痛点与投入产出，明确建设必要性与目标；\n（2）业务流程梳理：盘点现有人事、薪酬、社保、招聘等流程，识别可标准化、可共享的事项；\n（3）服务目录设计：明确服务事项、办理标准、时效承诺（SLA）与责任边界；\n（4）系统选型：选择或搭建 eHR、OA、自助服务平台与工单系统，支撑流程线上化；\n（5）组织设计：设置服务台、运营管理、流程管理、系统支持等内部单元，明确岗位职责与人员配置；\n（6）试点运行：选择部分业务单元或模块先行试点，验证流程与系统并积累经验；\n（7）全面推广：总结试点经验，完善服务目录与知识库，实现全集团推广并转入持续优化。","explanation":"","scoring":"评分要点：七个步骤每答对一步得 0.7 分，表述完整得满分。"},{"id":"P5-short-2","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"short","num":2,"stem":"2．简述人力资源数据核查工作中的三支柱分工。（5 分）","options":{},"context":[],"answer":"（1）COE（专家中心）：制定数据标准、数据字典与核查规则，明确口径定义、必填字段与校验逻辑，对争议口径作最终裁定；\n（2）HRBP（业务伙伴）：提出业务侧数据需求，确认业务口径（如绩效归属、异动生效时间），并反馈业务异常数据；\n（3）HRSSC（共享服务中心）：依据数据字典与规则承担数据采集、录入、核查、清洗与反馈的具体执行，输出核查报告并推动整改；\n（4）协同闭环：COE 定标准→HRSSC 执行核查→HRBP 确认业务口径→HRSSC 整改并归档，形成数据质量持续改进闭环。","explanation":"","scoring":"评分要点：三支柱各自职责每点 1 分，协同闭环 2 分。"},{"id":"P5-short-3","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"short","num":3,"stem":"3．简述 HRSSC 处理员工投诉的标准流程与注意事项。（5 分）","options":{},"context":[],"answer":"流程：\n（1）受理登记：通过热线/服务台/工单系统统一受理，完整记录投诉人、时间、事项与诉求；\n（2）情绪安抚：先共情倾听、稳定情绪，再聚焦客观事实；\n（3）分类判定：按政策类、流程类、系统类、服务态度类分类；\n（4）分流转办：政策类移交 COE，业务类移交 HRBP，系统类转系统支持，服务类由 SSC 自查整改；\n（5）处理反馈：在 SLA 时限内反馈处理进展与结果，做到事事有回音；\n（6）记录归档与复盘：完整归档工单，沉淀知识库，定期复盘共性问题并优化流程。\n注意事项：口径统一、依法合规、保守秘密、避免推诿、注重闭环与员工体验。","explanation":"","scoring":"评分要点：流程六步答出 5 步以上得 4 分，注意事项 1 分。"},{"id":"P5-short-4","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"short","num":4,"stem":"4．结合课程思政要求，简述 HRSSC 从业人员应具备的职业伦理与合规意识。（5 分）","options":{},"context":[],"answer":"（1）职业道德与职业伦理：树立严谨细致、诚实守信的职业操守，强化薪酬、档案等涉密数据的保密意识，养成“以员工为中心”的服务意识；\n（2）法治意识与合规文化：敬畏《劳动合同法》《社会保险法》《住房公积金管理条例》《个人所得税法》《个人信息保护法》，依法合规办理入转调离、社保申报与薪酬核算；\n（3）社会主义核心价值观：敬业奉献、公平公正，反对就业歧视与信息造假，维护劳动者合法权益；\n（4）数字化伦理与数据安全：坚守数据隐私保护底线，做到技术向善、数据有界，落实权限分级与最小必要原则；\n（5）责任担当与团队协作：在跨部门协同中主动沟通、不推诿，形成精益求精、持续改进的精益职业素养。","explanation":"","scoring":"评分要点：五个维度每答对一个维度得 1 分，能结合法规或案例说明可酌情加分。"},{"id":"P5-task-1","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"task","num":1,"stem":"1．【实操题 1】综合情景：薪酬差错与员工投诉处置（10 分）","options":{},"context":["背景：员工吴某发现 10 月工资中未支付国庆 3 天法定节假日加班费，情绪激动地拨打了 HRSSC 服务热线投诉，并在部门群里表示“公司克扣员工加班费，我要去劳动仲裁”。经 HRSSC 复核，确因当月复核工资表时疏忽漏发。吴某劳动合同约定以实际工资作为加班费计算基数，其基本工资 4500 元、岗位津贴 1500 元，公司实行标准 8 小时工作制。","任务：","（1）写出你作为 HRSSC 专员的处置流程；（4 分）","（2）写出与吴某沟通的具体话术要点；（3 分）","（3）计算吴某应补发的加班费金额（日工资按 21.75 天、8 小时/天折算，保留整数）；（2 分）","（4）指出事后应从流程上采取的 1 项改进措施。（1 分）"],"answer":"（1）处置流程：①立即受理并安抚情绪，承诺在 SLA 时限内核实并回复；②核实数据（调取考勤加班记录、审批单、工资表与银行发放记录），确认漏发事实与金额；③分类定性——属薪酬差错类（流程类）问题，SSC 内部可闭环解决，涉及金额补发需同步直线经理与 HRBP；④制定补救方案（次月工资补发或单独补发，并说明补发时间与方式）；⑤主动沟通致歉并反馈处理结果；⑥形成差错记录与整改台账，纳入复盘；⑦必要时在部门群作合规说明，避免谣言扩散。\n（2）沟通话术要点：“吴先生您好，非常抱歉给您带来困扰。我们已核实：您在国庆 10 月 1—3 日加班 3 天，因我们复核环节的疏忽导致加班费漏发，责任在我们。经核算应补发××元，将于×月×日随工资一并发放（或单独补发），届时请您核对。后续我们会增加加班费专项复核环节，杜绝此类问题再次发生。给您带来不便，再次向您致歉。”（要点：主动致歉、说明原因、给出金额与时间、承诺改进）\n（3）加班费计算：小时工资＝6000÷21.75÷8≈34.48 元/小时；法定节假日加班 3 天×8 小时＝24 小时；应补发＝34.48×24×300%≈2483 元。\n（4）改进措施：①在薪酬核算流程中增设“加班费专项复核”环节，将考勤系统加班记录与薪酬系统加班费项目自动比对；②实行薪酬双人复核与差错台账管理；③将本次案例纳入知识库与培训案例，提升核算人员风险意识。（答出 1 项即可）","explanation":"","scoring":"评分要点：流程 4 分（受理安抚—核实—定性—补救—沟通—整改—舆情应对，答出 4 项以上）；话术 3 分（态度、原因、金额时间、改进承诺）；计算 2 分；改进措施 1 分。重点考查服务意识、法规应用与闭环改进能力。"},{"id":"P5-task-2","paper":5,"focus":"综合卷　三支柱协同与运营管理、数据核查、法规与职业伦理、综合情景案例","type":"task","num":2,"stem":"2．【实操题 2】综合项目：为企业设计 HRSSC 流程优化方案（10 分）","options":{},"context":["背景：某集团现有员工 3000 人，下设 6 个业务单元，各单元 HR 独立运作，存在流程不统一、重复录入、员工咨询无统一入口、人均服务比低（1:180）等问题。集团决定建设 HRSSC，并委托你所在小组完成“员工入转调离流程优化方案”的设计。","任务：","（1）列出方案应包含的 6 个核心模块；（3 分）","（2）运用 SIPOC 方法界定“员工入职流程”的边界；（3 分）","（3）提出 3 条具体优化措施并说明预期效果；（3 分）","（4）说明方案中应体现的 1 项课程思政/合规要素。（1 分）"],"answer":"（1）方案核心模块：①现状调研与问题诊断（痛点清单、根因分析）；②目标与范围界定（覆盖入转调离四类场景、适用业务单元）；③流程现状图与优化后流程图（含前后对比）；④组织与职责设计（三支柱分工、服务台与权限）；⑤系统支撑方案（eHR/OA 流程配置、自助服务与电子签）；⑥实施计划与效果评估（分阶段里程碑、风险预案、量化指标）。\n（2）SIPOC 界定：\nS（供应商）：用人部门、招聘团队、候选人、IT 部门、行政；\nI（输入）：Offer 与录用条件、入职材料（证件、体检、离职证明）、岗位与薪酬数据、编制信息；\nP（流程）：入职准备→资料审核→文件签署→信息维护→权限开通→人事通知发放；\nO（输出）：eHR 员工档案、劳动合同与协议、账号权限、入职引导安排、合规归档记录；\nC（客户）：新员工、用人部门、HRBP、薪酬社保模块（下游）。\n（3）优化措施与预期效果：\n①统一流程与表单标准化（E/S）：将 6 个业务单元的差异化流程统一为集团标准模板，预期表单字段减少 30%、办理时长由 2 天缩短至 0.5 天；\n②搭建员工自助入职平台（I/A）：候选人在线提交材料、电子签劳动合同，信息自动写入 eHR 并触发权限开通，预期人工录入工时下降 70%、数据差错率下降至 1% 以下；\n③建立服务台与进度可视化（服务质效）：员工可实时查询入职办理进度，预期一次解决率提升至 90%、员工满意度显著提升。\n（4）课程思政/合规要素：方案须体现依法合规与数据安全——入职一个月内订立书面劳动合同（规避二倍工资风险）、核验前单位离职证明与竞业限制（规避双重雇佣与商业秘密风险）、体检与背景调查须取得候选人书面授权并按最小必要原则处理个人信息（遵守《个人信息保护法》）；同时体现“以员工为中心”的服务意识与精益求精的精益职业素养。","explanation":"","scoring":"评分要点：6 个模块每答出 1 项得 0.5 分；SIPOC 五要素答出 4 项以上得 3 分；3 条措施各 1 分（须含预期效果）；思政/合规要素 1 分。重点考查系统性思维、工具运用与价值引领。"}],"meta":{"course":"《人力资源共享服务》","code":"SX10401014","papers":5,"per_paper":100,"counts":{"single":100,"multi":50,"judge":50,"short":20,"task":10},"total_objective":200}};

var LS_KEY = "hrssc_srs_v1";

/* ============ 页内弹窗：微信内置浏览器禁用原生 prompt/confirm/alert ============ */
function openDlg(opt, cb) {
  var dlg = document.getElementById("dlg");
  var t = document.getElementById("dlgTitle");
  var m = document.getElementById("dlgMsg");
  var inp = document.getElementById("dlgInput");
  var btns = document.getElementById("dlgBtns");
  t.textContent = opt.title || "";
  m.textContent = opt.msg || "";
  if (opt.input) { inp.classList.remove("hide"); inp.value = opt.value || ""; }
  else { inp.classList.add("hide"); }
  while (btns.firstChild) btns.removeChild(btns.firstChild);
  dlg._cb = cb;
  var list = opt.buttons || [{ label: "确定", cls: "primary", value: true }];
  for (var i = 0; i < list.length; i++) {
    (function (b) {
      var el = document.createElement("button");
      el.className = "btn " + (b.cls || "");
      el.textContent = b.label;
      el.onclick = function () {
        var v = b.value;
        if (opt.input) v = (b.value === true) ? inp.value : null;
        dlg.classList.add("hide");
        if (dlg._cb) dlg._cb(v);
        dlg._cb = null;
      };
      btns.appendChild(el);
    })(list[i]);
  }
  dlg.classList.remove("hide");
  if (opt.input) setTimeout(function () { try { inp.focus(); } catch (e) {} }, 120);
}
function uiAlert(msg) {
  openDlg({ title: "提示", msg: msg, buttons: [{ label: "知道了", cls: "primary", value: true }] }, null);
}
function uiConfirm(msg, onYes) {
  openDlg({ title: "请确认", msg: msg, buttons: [
    { label: "取消", cls: "ghost", value: false },
    { label: "确定", cls: "primary", value: true }
  ] }, function (v) { if (v && onYes) onYes(); });
}
function uiPrompt(title, msg, def, onDone) {
  openDlg({ title: title, msg: msg, input: true, value: def || "",
    buttons: [{ label: "取消", cls: "ghost", value: false },
              { label: "确定", cls: "primary", value: true }] },
    function (v) { if (onDone) onDone(v === null ? null : v); });
}

/* ============ 存储 ============ */
function loadStore() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && d.items) return d;
    }
  } catch (e) {}
  return { items: {}, updated: 0 };
}
function saveStore() {
  store.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
}
function rec(id) {
  if (!store.items[id]) store.items[id] = { seen:0, right:0, wrong:0, box:0, due:0, ease:2.5, ivl:0, last:0 };
  return store.items[id];
}
function schedule(id, grade) {
  var r = rec(id);
  r.seen++;
  if (grade === 3) r.right++;
  else if (grade === 1) r.wrong++;
  if (grade === 1) { r.box = 0; r.ease = Math.max(1.3, r.ease - 0.2); r.ivl = 0.5; }
  else if (grade === 2) { r.box = Math.max(1, r.box); r.ease = Math.max(1.3, r.ease - 0.15); r.ivl = r.ivl ? r.ivl * 1.6 : 1; }
  else { r.box++; r.ivl = r.ivl ? r.ivl * r.ease : 1; }
  r.due = Date.now() + Math.round(r.ivl) * DAY;
  r.last = Date.now();
  saveStore();
}

/* ============ 署名 ============ */
function getNick() { try { return localStorage.getItem(NICK_KEY) || ""; } catch (e) { return ""; } }
function setNick(v) { try { localStorage.setItem(NICK_KEY, v); } catch (e) {} }
function saveName() {
  var v = (document.getElementById("nameInput").value || "").replace(/^\s+|\s+$/g, "");
  if (!v) { changeName(); return; }
  setNick(v.slice(0, 16));
  renderHome();
}
function changeName() {
  uiPrompt("改名字", "用于成绩单署名，只存在你的手机里，不上传。", getNick(), function (v) {
    if (v === null) return;
    setNick(v.replace(/^\s+|\s+$/g, "").slice(0, 16));
    renderHome();
  });
}

/* ============ 首页 ============ */
var TN = { single:"单选", multi:"多选", judge:"判断", short:"简答", task:"实操" };
var MODE_LABEL = { practice:"练习", exam:"模拟考", flash:"闪卡", wrong:"错题" };

function renderHome() {
  var nm = getNick();
  var nc = document.getElementById("nameCard");
  if (nc) { if (nm) nc.classList.add("hide"); else nc.classList.remove("hide"); }
  var nl = document.getElementById("nameLine");
  if (nl) nl.textContent = nm ? ("当前使用者：" + nm) : "未署名";

  var pg = document.getElementById("paperGrid");
  var html = "";
  for (var n = 1; n <= 5; n++) {
    var cnt = 0, focus = "";
    for (var i = 0; i < QS.length; i++) {
      if (QS[i].paper === n) { cnt++; if (!focus) focus = QS[i].focus; }
    }
    var f = (focus || "").replace(/第[一二三四五]章/g, "").slice(0, 26);
    html += '<div class="tile" onclick="startPractice({scope:' + n + ',mode:\'practice\'})">' +
      '<div class="k">卷 ' + n + '</div><div class="v">' + cnt + ' 题</div>' +
      '<div class="d">' + escapeHtml(f) + '</div></div>';
  }
  pg.innerHTML = html;

  var now = Date.now();
  var due = 0, wrongN = 0, seenN = 0, rightN = 0, wrongAnsN = 0;
  var byType = {};
  var ids = [];
  for (var id in store.items) {
    if (!store.items.hasOwnProperty(id)) continue;
    var r = store.items[id];
    if (r.seen > 0) {
      ids.push(id); seenN++;
      rightN += r.right; wrongAnsN += r.wrong;
      if (r.wrong > 0) wrongN++;
      if (r.due && r.due <= now) due++;
      var q = QS[QIDX[id]];
      if (q) {
        if (!byType[q.type]) byType[q.type] = { r: 0, w: 0 };
        byType[q.type].r += r.right;
        byType[q.type].w += r.wrong;
      }
    }
  }
  document.getElementById("dueCount").textContent = due;
  document.getElementById("wrongCount").textContent = wrongN;

  var box = document.getElementById("statsBox");
  if (!seenN) {
    box.innerHTML = '<div class="warnbox">还没有记录。从上面任一项开始，答完一题就会自动记进度。</div>';
    return;
  }
  var acc = Math.round(rightN / (rightN + wrongAnsN) * 100);
  var cov = Math.round(seenN / QS.length * 100);
  var rows = "";
  var order = ["single", "multi", "judge", "short", "task"];
  for (var k = 0; k < order.length; k++) {
    var key = order[k], s = byType[key];
    if (!s) continue;
    var tot = s.r + s.w, a = tot ? Math.round(s.r / tot * 100) : 0;
    rows += "<tr><td>" + TN[key] + "</td><td class=\"mono\">" + s.r + "</td><td class=\"mono\">" +
      s.w + "</td><td class=\"mono\">" + a + "%</td><td><div class=\"bar\" style=\"width:90px\">" +
      "<i style=\"width:" + a + "%\"></i></div></td></tr>";
  }
  box.innerHTML =
    '<div class="grid g3" style="margin-bottom:10px">' +
      '<div class="tile" style="cursor:default"><div class="k">覆盖率</div><div class="v">' + cov +
      '%</div><div class="d">' + seenN + ' / ' + QS.length + ' 题</div></div>' +
      '<div class="tile" style="cursor:default"><div class="k">正确率</div><div class="v">' + acc +
      '%</div><div class="d">答对 ' + rightN + ' / ' + (rightN + wrongAnsN) + '</div></div>' +
      '<div class="tile" style="cursor:default"><div class="k">待攻克</div><div class="v">' + wrongN +
      '</div><div class="d">错过的题</div></div>' +
    '</div>' +
    '<table class="t"><thead><tr><th>题型</th><th>对</th><th>错</th><th>正确率</th><th></th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

/* ============ 会话启动 ============ */
function pickQuestions(o) {
  var list = [];
  for (var i = 0; i < QS.length; i++) {
    var q = QS[i];
    if (o.scope !== "all" && q.paper !== Number(o.scope)) continue;
    if (o.only) {
      if (o.only === "short") { if (q.type !== "short" && q.type !== "task") continue; }
      else if (q.type !== o.only) continue;
    }
    list.push(q);
  }
  return list;
}

function shuffleKeepType(list) {
  var order = { single:0, multi:1, judge:2, short:3, task:4 };
  var g = {};
  for (var i = 0; i < list.length; i++) {
    var t = list[i].type;
    if (!g[t]) g[t] = [];
    g[t].push(list[i]);
  }
  var keys = [];
  for (var k in order) { if (order.hasOwnProperty(k) && g[k]) keys.push(k); }
  keys.sort(function (a, b) { return order[a] - order[b]; });
  var out = [];
  for (var j = 0; j < keys.length; j++) {
    var arr = g[keys[j]].slice();
    arr.sort(function () { return Math.random() - 0.5; });
    for (var m = 0; m < arr.length; m++) out.push(arr[m]);
  }
  return out;
}

function startPractice(opt) {
  var list = pickQuestions(opt);
  if (!list.length) { uiAlert("这个范围没有题。"); return; }
  S = { mode:"practice", list: shuffleKeepType(list), i:0, ans:{}, started: Date.now(), showAns:{} };
  enterQuiz();
}

function startExamPick() {
  var btns = [];
  for (var n = 1; n <= 5; n++) {
    btns.push({ label: "卷 " + n, cls: n === 1 ? "primary" : "", value: n });
  }
  openDlg({ title:"选一套卷", msg:"100 分 / 120 分钟。交卷前不显示对错。", buttons: btns }, function (v) {
    if (!v) return;
    var list = [];
    for (var i = 0; i < QS.length; i++) if (QS[i].paper === v) list.push(QS[i]);
    S = { mode:"exam", list:list, i:0, ans:{}, started: Date.now(),
          deadline: Date.now() + 120 * 60000, showAns:{} };
    enterQuiz();
  });
}

function startSRS() {
  var now = Date.now(), list = [], fallback = [];
  for (var i = 0; i < QS.length; i++) {
    var r = store.items[QS[i].id];
    if (!r || r.seen <= 0) continue;
    if (r.due === 0 || r.due <= now) list.push(QS[i]);
    if (r.box < 5) fallback.push(QS[i]);
  }
  if (!list.length) {
    if (!fallback.length) { uiAlert("没有到期的卡片。先去练几道题，系统会自动按间隔排复习。"); return; }
    fallback.sort(function () { return Math.random() - 0.5; });
    S = { mode:"flash", list: fallback.slice(0, 40), i:0, ans:{}, started: Date.now(), showAns:{} };
  } else {
    S = { mode:"flash", list: list.slice(0, 60), i:0, ans:{}, started: Date.now(), showAns:{} };
  }
  enterQuiz();
}

function showWrong() {
  var ids = Object.keys(store.items).filter(function (id) { return store.items[id].wrong > 0; });
  ids.sort(function (a, b) { return store.items[b].wrong - store.items[a].wrong; });
  if (!ids.length) { uiAlert("还没有错题记录。先练几轮再来。"); return; }
  var list = [];
  for (var i = 0; i < ids.length; i++) {
    var q = QS[QIDX[ids[i]]];
    if (q) list.push(q);
  }
  S = { mode:"wrong", list:list, i:0, ans:{}, started: Date.now(), showAns:{} };
  enterQuiz();
}

function retryWrongOnly() {
  if (!S) return;
  var ids = [];
  for (var id in S.ans) {
    if (!S.ans.hasOwnProperty(id)) continue;
    var a = S.ans[id], q = QS[QIDX[id]];
    if (!q) continue;
    if (q.type === "short" || q.type === "task") { if (a.grade === 1) ids.push(id); }
    else if (!a.correct) ids.push(id);
  }
  if (!ids.length) { uiAlert("这次没错题。"); return; }
  var list = [];
  for (var i = 0; i < ids.length; i++) { var q2 = QS[QIDX[ids[i]]]; if (q2) list.push(q2); }
  S = { mode:"wrong", list:list, i:0, ans:{}, started: Date.now(), showAns:{} };
  enterQuiz();
}

function enterQuiz() {
  document.getElementById("vHome").classList.add("hide");
  document.getElementById("vResult").classList.add("hide");
  document.getElementById("vQuiz").classList.remove("hide");
  document.getElementById("nav").classList.remove("hide");
  renderQ();
}
function goHome() {
  S = null;
  document.getElementById("vQuiz").classList.add("hide");
  document.getElementById("vResult").classList.add("hide");
  document.getElementById("vHome").classList.remove("hide");
  document.getElementById("nav").classList.add("hide");
  renderHome();
}

/* ============ 渲染 ============ */
function renderQ() {
  if (!S) return;
  var q = S.list[S.i];
  var a = S.ans[q.id];
  var revealed = (S.mode === "exam" && !S.submitted) ? false : !!S.showAns[q.id];

  document.getElementById("qBadge").textContent = TN[q.type];
  document.getElementById("qBadge").className = "badge " + q.type;
  document.getElementById("qMeta").textContent =
    MODE_LABEL[S.mode] + " · 卷" + q.paper + " 第" + q.num + "题" +
    (store.items[q.id] ? " · 见过" + store.items[q.id].seen + "次" : "");

  document.getElementById("qPos").textContent = (S.i + 1) + " / " + S.list.length;
  document.getElementById("qProg").style.width = ((S.i + 1) / S.list.length * 100) + "%";

  var tm = document.getElementById("qTimer");
  if (S.mode === "exam" && !S.submitted) {
    tm.textContent = "剩余 " + fmtMS(Math.max(0, S.deadline - Date.now()));
  } else { tm.textContent = ""; }

  var ctx = document.getElementById("qCtx");
  if (q.context && q.context.length) {
    ctx.textContent = q.context.join("\n");
    ctx.classList.remove("hide");
  } else { ctx.textContent = ""; ctx.classList.add("hide"); }

  document.getElementById("qStem").textContent = q.stem.replace(/^\d+．/, "");

  var box = document.getElementById("qOpts");
  while (box.firstChild) box.removeChild(box.firstChild);
  if (q.type === "single" || q.type === "multi" || q.type === "judge") {
    var opts = (q.type === "judge") ? { A:"正确", B:"错误" } : q.options;
    var chosen = a ? a.chosen : [];
    var keys = [];
    for (var k in opts) if (opts.hasOwnProperty(k)) keys.push(k);
    keys.sort();
    var ansKeys = (q.type === "judge") ? [q.answer === "正确" ? "A" : "B"] : q.answer.split("");
    for (var i = 0; i < keys.length; i++) {
      (function (key) {
        var el = document.createElement("div");
        el.className = "opt";
        var isSel = chosen.indexOf(key) >= 0;
        if (isSel) el.classList.add("sel");
        if (revealed) {
          if (ansKeys.indexOf(key) >= 0) el.classList.add("right");
          else if (isSel) el.classList.add("wrong");
          else el.classList.add("dim");
        }
        el.innerHTML = '<span class="lab">' + key + '</span><span>' + escapeHtml(opts[key]) + '</span>';
        el.onclick = function () { chooseOpt(q, key, revealed); };
        box.appendChild(el);
      })(keys[i]);
    }
  }

  var bar = document.getElementById("qBar");
  while (bar.firstChild) bar.removeChild(bar.firstChild);
  var subj = (q.type === "short" || q.type === "task");

  if (!revealed) {
    if (q.type === "multi") addBtn(bar, "提交本题", "primary", function () { submitMulti(q); });
    if (subj) addBtn(bar, "显示参考答案", "primary", function () { reveal(q); });
  } else {
    if (subj) {
      addBtn(bar, "忘了 (1)", "", function () { gradeSubj(q, 1); });
      addBtn(bar, "想起但费劲 (2)", "", function () { gradeSubj(q, 2); });
      addBtn(bar, "顺利 (3)", "primary", function () { gradeSubj(q, 3); });
    } else {
      addBtn(bar, "再答一次", "", function () { retry(q); });
    }
  }

  var ok = document.getElementById("qAnsOk"), bad = document.getElementById("qAnsBad");
  var exp = document.getElementById("qExp"), ref = document.getElementById("qRef");
  var hint = document.getElementById("qHint");
  ok.classList.add("hide"); bad.classList.add("hide");
  exp.classList.add("hide"); ref.classList.add("hide"); hint.classList.add("hide");

  if (revealed) {
    if (!a) {
      ok.classList.remove("hide");
      ok.innerHTML = "【参考答案】\n" + escapeHtml(q.answer);
      if (q.scoring) { ref.classList.remove("hide"); ref.innerHTML = "<b>【评分说明】</b>\n" + escapeHtml(q.scoring); }
    } else if (subj) {
      var g = a.grade;
      (g === 1 ? bad : ok).classList.remove("hide");
      (g === 1 ? bad : ok).innerHTML = "自评：" + (g === 1 ? "忘了" : g === 2 ? "想起但费劲" : "顺利") +
        "\n【参考答案】\n" + escapeHtml(q.answer);
      if (q.scoring) { ref.classList.remove("hide"); ref.innerHTML = "<b>【评分说明】</b>\n" + escapeHtml(q.scoring); }
    } else {
      (a.correct ? ok : bad).classList.remove("hide");
      var myAns = (q.type === "judge") ? (a.chosen[0] === "A" ? "正确" : "错误") : a.chosen.slice().sort().join("");
      (a.correct ? ok : bad).innerHTML =
        (a.correct ? "正确 ✓" : "错　你选：" + (myAns || "（未选）")) +
        "\n【正确答案】" + escapeHtml(q.answer);
      if (q.explanation) {
        exp.classList.remove("hide");
        exp.innerHTML = "<b>【解析】</b>\n" + escapeHtml(q.explanation);
      }
    }
  }

  document.getElementById("qKeys").innerHTML = subj
    ? '<span class="kbd">1/2/3</span> 自评　<span class="kbd">←/→</span> 翻页'
    : '<span class="kbd">A-D</span> 选项　<span class="kbd">←/→</span> 翻页';

  updateNav();
}

function addBtn(bar, label, cls, fn) {
  var b = document.createElement("button");
  b.className = "btn " + (cls || "");
  b.textContent = label;
  b.onclick = fn;
  bar.appendChild(b);
}

function optsOf(q) { return (q.type === "judge") ? { A:"正确", B:"错误" } : q.options; }

function paintSel(q, a) {
  var keys = [];
  var o = optsOf(q);
  for (var k in o) if (o.hasOwnProperty(k)) keys.push(k);
  keys.sort();
  var els = document.querySelectorAll("#qOpts .opt");
  for (var i = 0; i < els.length; i++) {
    var on = a.chosen.indexOf(keys[i]) >= 0;
    if (on) els[i].classList.add("sel"); else els[i].classList.remove("sel");
  }
}

function chooseOpt(q, k, revealed) {
  if (revealed) return;
  if (!S.ans[q.id]) S.ans[q.id] = { chosen: [], flagged: false };
  var a = S.ans[q.id];
  var examPhase = (S.mode === "exam" && !S.submitted);

  if (q.type === "multi") {
    var ix = a.chosen.indexOf(k);
    if (ix >= 0) a.chosen.splice(ix, 1); else a.chosen.push(k);
    paintSel(q, a);
    updateNav();
    return;
  }
  a.chosen = [k];
  if (examPhase) { paintSel(q, a); updateNav(); return; }
  judge(q);
}

function submitMulti(q) {
  var a = S.ans[q.id];
  if (!a || !a.chosen.length) {
    var h = document.getElementById("qHint");
    h.classList.remove("hide");
    h.textContent = "先选至少一个选项，再点「提交本题」。多选题按完全匹配判分。";
    return;
  }
  if (S.mode === "exam" && !S.submitted) { renderQ(); return; }
  judge(q);
}

function judge(q) {
  var a = S.ans[q.id];
  if (!a || !a.chosen.length) return;
  var ansKeys = (q.type === "judge") ? [q.answer === "正确" ? "A" : "B"] : q.answer.split("");
  var mine = a.chosen.slice().sort(), tgt = ansKeys.slice().sort();
  var okAll = (mine.length === tgt.length);
  for (var i = 0; i < mine.length; i++) if (mine[i] !== tgt[i]) okAll = false;
  a.correct = okAll;
  a.judged = true;
  S.showAns[q.id] = true;
  schedule(q.id, a.correct ? 3 : 1);
  renderQ();
}

function reveal(q) { S.showAns[q.id] = true; renderQ(); }

function gradeSubj(q, g) {
  if (!S.ans[q.id]) S.ans[q.id] = { chosen: [], flagged: false };
  var a = S.ans[q.id];
  a.grade = g; a.correct = (g === 3); a.judged = true;
  S.showAns[q.id] = true;
  schedule(q.id, g);
  renderQ();
}

function retry(q) {
  delete S.showAns[q.id];
  delete S.ans[q.id];
  renderQ();
}

/* ============ 导航 ============ */
function updateNav() {
  var q = S.list[S.i];
  var main = document.getElementById("navMain");
  document.getElementById("navPrev").disabled = (S.i === 0);
  var examRunning = (S.mode === "exam" && !S.submitted);
  var nextBtn = document.getElementById("navNext");
  if (nextBtn) { if (examRunning) nextBtn.classList.add("hide"); else nextBtn.classList.remove("hide"); }

  if (examRunning) {
    main.textContent = (S.i === S.list.length - 1) ? "交卷" : "下一题";
  } else if (S.i >= S.list.length - 1) {
    main.textContent = "查看结果";
  } else {
    main.textContent = "下一题";
  }
}

function mainAction() {
  if (!S) return;
  var examRunning = (S.mode === "exam" && !S.submitted);
  if (examRunning) {
    if (S.i === S.list.length - 1) submitExam();
    else nextQ();
    return;
  }
  if (S.i >= S.list.length - 1) { showResult(); return; }
  nextQ();
}
function nextQ() { if (S && S.i < S.list.length - 1) { S.i++; renderQ(); scrollTop(); } }
function prevQ() { if (S && S.i > 0) { S.i--; renderQ(); scrollTop(); } }
function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }

function quitSession() {
  if (!S) { goHome(); return; }
  var done = 0;
  for (var id in S.ans) if (S.ans.hasOwnProperty(id)) done++;
  var msg = done ? "退出？已作答的记录会保留在进度里。" : "还没答题，确定退出？";
  uiConfirm(msg, function () { goHome(); });
}

/* ============ 结算 ============ */
function submitExam() {
  var un = 0;
  for (var i = 0; i < S.list.length; i++) {
    var q = S.list[i], a = S.ans[q.id];
    if (!a) { un++; continue; }
    if (q.type === "short" || q.type === "task") { if (!a.grade) un++; }
    else if (!a.chosen.length) un++;
  }
  if (un) { uiConfirm("还有 " + un + " 题没答，确认交卷？", doSubmitExam); return; }
  doSubmitExam();
}

function doSubmitExam() {
  S.submitted = true;
  for (var i = 0; i < S.list.length; i++) {
    var q = S.list[i], a = S.ans[q.id];
    if (!a) continue;
    if (q.type !== "short" && q.type !== "task") {
      if (a.chosen.length && !a.judged) {
        var ansKeys = (q.type === "judge") ? [q.answer === "正确" ? "A" : "B"] : q.answer.split("");
        var mine = a.chosen.slice().sort(), tgt = ansKeys.slice().sort();
        var okAll = (mine.length === tgt.length);
        for (var j = 0; j < mine.length; j++) if (mine[j] !== tgt[j]) okAll = false;
        a.correct = okAll;
        a.judged = true;
      }
      S.showAns[q.id] = true;
      schedule(q.id, a.correct ? 3 : 1);
    }
  }
  showResult();
}

function scoreOf() {
  var got = 0, total = 0;
  var W = { single: 1.5, multi: 2, judge: 1 };
  for (var i = 0; i < S.list.length; i++) {
    var q = S.list[i];
    if (!W[q.type]) continue;
    total += W[q.type];
    var a = S.ans[q.id];
    if (a && a.correct) got += W[q.type];
  }
  return { got: got, total: total };
}

function showResult() {
  document.getElementById("vQuiz").classList.add("hide");
  document.getElementById("nav").classList.add("hide");
  document.getElementById("vResult").classList.remove("hide");
  var sc = scoreOf();
  var acc = sc.total ? Math.round(sc.got / sc.total * 100) : 0;
  var subjCount = 0;
  for (var i = 0; i < S.list.length; i++) {
    if (S.list[i].type === "short" || S.list[i].type === "task") subjCount++;
  }
  var minutes = Math.round((Date.now() - S.started) / 60000);

  document.getElementById("resHead").innerHTML =
    '<div style="font-size:20px;font-weight:700">' +
      (S.mode === "exam" ? "考试完成" : MODE_LABEL[S.mode] + "完成") + '</div>' +
    '<div class="tiny" style="margin-top:4px">用时 ' + minutes + ' 分钟 · 共 ' + S.list.length + ' 题' +
      (subjCount ? '（其中 ' + subjCount + ' 道主观题按自评，不计入客观分）' : '') + '</div>' +
    '<div class="grid g3" style="margin-top:12px">' +
      '<div class="tile" style="cursor:default"><div class="k">客观得分</div><div class="v">' + sc.got + ' / ' + sc.total + '</div></div>' +
      '<div class="tile" style="cursor:default"><div class="k">正确率</div><div class="v">' + acc + '%</div></div>' +
      '<div class="tile" style="cursor:default"><div class="k">进复习队列</div><div class="v">' +
        Object.keys(S.ans).length + '</div></div>' +
    '</div>';

  var rows = "";
  for (var k = 0; k < S.list.length; k++) {
    (function (ix) {
      var q = S.list[ix], a = S.ans[q.id];
      var subj = (q.type === "short" || q.type === "task");
      var mark, cls;
      if (!a || (!a.chosen.length && !a.grade)) { mark = "未答"; cls = ""; }
      else if (subj) { mark = (a.grade === 1 ? "忘了" : a.grade === 2 ? "费劲" : "顺利"); cls = (a.grade === 1 ? "bad" : "ok"); }
      else { mark = a.correct ? "对" : "错"; cls = a.correct ? "ok" : "bad"; }
      rows += '<tr><td class="mono">' + (ix + 1) + '</td><td>' + TN[q.type] + '</td>' +
        '<td>' + escapeHtml(q.stem.replace(/^\d+．/, "").slice(0, 40)) + '…</td>' +
        '<td><span class="badge ' + q.type + '">' + mark + '</span></td>' +
        '<td><button class="btn sm ghost" onclick="reviewOne(' + ix + ')">看题</button></td></tr>';
    })(k);
  }
  document.getElementById("resBody").innerHTML =
    '<table class="t"><thead><tr><th>#</th><th>题型</th><th>题干</th><th>结果</th><th></th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function reviewOne(ix) {
  S.i = ix;
  S.showAns[S.list[ix].id] = true;
  document.getElementById("vResult").classList.add("hide");
  document.getElementById("vQuiz").classList.remove("hide");
  document.getElementById("nav").classList.remove("hide");
  renderQ();
}

/* ============ 分享 / 导出 ============ */
function summaryText() {
  var now = Date.now();
  var seenN = 0, rightN = 0, wrongN = 0, weak = 0;
  for (var id in store.items) {
    if (!store.items.hasOwnProperty(id)) continue;
    var r = store.items[id];
    if (r.seen > 0) { seenN++; rightN += r.right; wrongN += r.wrong; }
    if (r.wrong > 0) weak++;
  }
  var acc = (rightN + wrongN) ? Math.round(rightN / (rightN + wrongN) * 100) : 0;
  var cov = Math.round(seenN / QS.length * 100);
  var nm = getNick() || "同学";
  var d = new Date();
  var ds = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  return "【HRSSC 人力资源共享服务 · 训练记录】\n" + nm +
    "\n题库覆盖 " + cov + "%（" + seenN + "/" + QS.length + " 题）" +
    "\n作答正确率 " + acc + "%（对 " + rightN + " / 共 " + (rightN + wrongN) + "）" +
    "\n待攻克错题 " + weak + " 道" +
    "\n日期 " + ds +
    "\n\n——《人力资源共享服务》（SX10401014）5 套模拟卷";
}

function copyShareText() {
  var txt = summaryText();
  var out = document.getElementById("shareOut");
  out.classList.remove("hide");
  out.textContent = txt;
  var done = function () { out.textContent = txt + "\n\n已复制，去微信粘贴发送。"; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  var ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) done();
  else uiAlert("当前浏览器不允许自动复制，请长按上面的文字手动复制。");
}

function exportWrongDoc() {
  var ids = Object.keys(store.items).filter(function (id) { return store.items[id].wrong > 0; });
  ids.sort(function (a, b) { return store.items[b].wrong - store.items[a].wrong; });
  if (!ids.length) { uiAlert("还没有错题。先练几轮再来导出。"); return; }
  var nm = getNick() || "同学";
  var TN2 = { single:"单选题", multi:"多选题", judge:"判断题", short:"简答题", task:"实操题" };
  var body = "";
  for (var i = 0; i < ids.length; i++) {
    var q = QS[QIDX[ids[i]]];
    if (!q) continue;
    var r = store.items[ids[i]];
    body += '<p><b>' + (i + 1) + '. （卷' + q.paper + ' · ' + TN2[q.type] + '）错了 ' + r.wrong + ' 次</b><br>' +
      escHtml(q.stem.replace(/^\d+．/, "").replace(/[\u3000]+/g, " ")) + '</p>';
    if (q.options && Object.keys(q.options).length) {
      var ks = Object.keys(q.options).sort(), lines = [];
      for (var k = 0; k < ks.length; k++) lines.push(ks[k] + ". " + escHtml(q.options[ks[k]]));
      body += '<p style="margin-left:24px">' + lines.join("<br>") + '</p>';
    }
    if (q.context && q.context.length) {
      body += '<p style="margin-left:24px;color:#555">' + escHtml(q.context.join("\n")) + '</p>';
    }
    body += '<p style="margin-left:24px;background:#f4f6f9;padding:6px"><b>答案：</b>' + escHtml(q.answer) + '</p>';
    if (q.explanation) body += '<p style="margin-left:24px"><b>解析：</b>' + escHtml(q.explanation) + '</p>';
    if (q.scoring) body += '<p style="margin-left:24px;color:#666"><b>评分说明：</b>' + escHtml(q.scoring) + '</p>';
    body += "<br>";
  }
  var d = new Date();
  var ds = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  var html = '<html><head><meta charset="utf-8"><title>HRSSC 错题本</title></head>' +
    '<body style="font-family:Microsoft YaHei,sans-serif;font-size:11pt;line-height:1.7">' +
    '<h2 style="text-align:center">《人力资源共享服务》错题本</h2>' +
    '<p style="text-align:center;color:#666">' + escHtml(nm) + '　|　共 ' + ids.length + ' 道　|　' + ds + '</p>' +
    '<hr>' + body + '</body></html>';

  var blob = new Blob(["\ufeff", html], { type: "application/msword" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "HRSSC错题本_" + nm + "_" + ds + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
}

/* ============ 备份 ============ */
function exportProgress() {
  var blob = new Blob([JSON.stringify(store, null, 1)], { type: "application/json" });
  var a = document.createElement("a");
  var d = new Date();
  var ds = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  a.href = URL.createObjectURL(blob);
  a.download = "hrssc_progress_" + ds + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function importProgress(el) {
  var f = el.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || !d.items) throw new Error("格式不对");
      store = d;
      saveStore();
      renderHome();
      uiAlert("已导入。");
    } catch (e) { uiAlert("导入失败：" + e.message); }
  };
  r.readAsText(f);
  el.value = "";
}
function resetProgress() {
  uiConfirm("清空全部答题记录与复习排程？", function () {
    store = { items: {}, updated: 0 };
    saveStore();
    renderHome();
  });
}

/* ============ 工具 ============ */
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function escHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/\n/g, "<br>");
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function fmtMS(ms) {
  var m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return pad2(m) + ":" + pad2(s);
}

/* ============ 键盘（桌面端） ============ */
document.addEventListener("keydown", function (e) {
  if (!S) return;
  var tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (document.getElementById("dlg").classList.contains("hide") === false) return;

  var q = S.list[S.i];
  var revealed = (S.mode === "exam" && !S.submitted) ? false : !!S.showAns[q.id];

  if (e.key === "ArrowRight") { nextQ(); e.preventDefault(); return; }
  if (e.key === "ArrowLeft") { prevQ(); e.preventDefault(); return; }
  if (e.key === "Enter") { mainAction(); e.preventDefault(); return; }
  if (q.type === "short" || q.type === "task") {
    if (revealed && (e.key === "1" || e.key === "2" || e.key === "3")) {
      gradeSubj(q, Number(e.key));
      e.preventDefault();
    }
    return;
  }
  var map = { "1":"A", "2":"B", "3":"C", "4":"D", "a":"A", "b":"B", "c":"C", "d":"D" };
  var k = map[(e.key || "").toLowerCase()];
  if (k && !revealed) { chooseOpt(q, k, false); e.preventDefault(); }
});

/* ============ 计时器 ============ */
setInterval(function () {
  if (S && S.mode === "exam" && !S.submitted) {
    var left = S.deadline - Date.now();
    document.getElementById("qTimer").textContent = "剩余 " + fmtMS(Math.max(0, left));
    if (left <= 0) { submitExam(); }
  }
}, 1000);

renderHome();
</script>
